<svg xmlns="http://www.w3.org/2000/svg" width="876" height="342" viewBox="0 0 876 342" role="img" aria-label="academic-research — Screening: Ausschlussgruende dokumentieren (Mitschnitt aus docs/quickstart-protocol.md)">
  <title>academic-research — Screening: Ausschlussgruende dokumentieren (Mitschnitt aus docs/quickstart-protocol.md)</title>
  <rect x="0.5" y="0.5" width="875" height="341" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 10.5a10 10 0 0 1 10-10h855a10 10 0 0 1 10 10v22h-875z" fill="#161b22" stroke="#30363d"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="56" cy="16" r="6" fill="#28c840"/>
  <text x="438" y="21" fill="#8b949e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" text-anchor="middle">academic-research — Screening: Ausschlussgruende dokumentieren (Mitschnitt aus docs/quickstart-protocol.md)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
    <text x="18" y="60"><tspan fill="#3fb950">$ </tspan><tspan fill="#f0f6fc">vault.add_excluded_source('issue639-demo-excluded',</tspan></text>
    <text x="18" y="80"><tspan fill="#f0f6fc">                  reason='Kein Volltext zugaenglich (Paywall ohne Institutionszugang) —</tspan></text>
    <text x="18" y="100"><tspan fill="#f0f6fc">                  Ausschluss im Screening-Schritt')</tspan></text>
    <text x="18" y="120"><tspan fill="#8b949e">-&gt; ok</tspan></text>
    <text x="18" y="160"><tspan fill="#3fb950">$ </tspan><tspan fill="#f0f6fc">vault.list_excluded_sources()</tspan></text>
    <text x="18" y="180"><tspan fill="#8b949e">-&gt; Ausgeschlossen: 1</tspan></text>
    <text x="18" y="200"><tspan fill="#8b949e">   - issue639-demo-excluded: Kein Volltext zugaenglich (Paywall ohne Institutionszugang)</tspan></text>
    <text x="18" y="240"><tspan fill="#3fb950">$ </tspan><tspan fill="#f0f6fc">vault.is_excluded('issue639-demo-excluded')</tspan></text>
    <text x="18" y="260"><tspan fill="#3fb950">-&gt; True</tspan></text>
    <text x="18" y="300"><tspan fill="#3fb950">$ </tspan><tspan fill="#f0f6fc">vault.is_excluded('issue626-demo-verbatim')</tspan></text>
    <text x="18" y="320"><tspan fill="#8b949e">-&gt; False</tspan></text>
  </g>
</svg>
