name: protect-operator-files
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  protect:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Kernel paths are frozen for every author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CONTROL_GLOBS: '["AGENTS.md", "CLAUDE.md", "NORTHSTAR.md", "Makefile", "mk/**", ".claude/settings.json", ".claude/settings.local.json", ".claude/rules/**", ".claude/skills/**", ".claude/agents/**", ".claude/commands/**", ".claude/hooks/**", ".claude/workflows/**", ".mcp.json", ".github/**", "**/.editorconfig", ".node-version", "pnpm-workspace.yaml", "tsconfig.base.json", "tsconfig.json", "eslint.config.mjs", ".prettierrc.json", ".prettierignore", "vitest.config.ts", "compose*.yaml", "compose*.yml", "docker-compose*.yaml", "docker-compose*.yml", "gates/gate.py", "gates/lib/**", "gates/tests/**", "gates/facts/**", "gates/templates/**", "gates/proofs/**", "gates/bash_rules.json", "gates/project.json", "gates/sgconfig.yml", "gates/suppress-baseline.json", "ops/conductor/**", "docs/autonomy/charter.md", "docs/autonomy/lead-goal.md", "docs/autonomy/watchdog-routine.md"]'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          def api(path, jq):
              out = subprocess.run(["gh", "api", "--paginate", path, "--jq", jq], capture_output=True, text=True, check=True)
              return [line for line in out.stdout.splitlines() if line]
          def rx(glob):
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i): out, i = out + "(?:.*/)?", i + 3
                  elif glob.startswith("**", i): out, i = out + ".*", i + 2
                  elif glob[i] == "*": out, i = out + "[^/]*", i + 1
                  else: out, i = out + re.escape(glob[i]), i + 1
              return re.compile(out + "$")
          globs = [rx(g) for g in json.loads(os.environ["CONTROL_GLOBS"])]
          if not globs:
              sys.exit("no kernel globs embedded; the check stays red")
          control = lambda f: any(g.match(f) for g in globs)
          repo, pr = os.environ["REPO"], os.environ["PR"]
          rows = api(f"repos/{repo}/pulls/{pr}/files", '.[] | [.filename, (.previous_filename // "")] | @json')
          listed = [json.loads(row) for row in rows]
          changed = int(json.loads(api(f"repos/{repo}/pulls/{pr}", ".changed_files")[0]))
          # constraint: the files endpoint lists at most 3000 files (GitHub REST docs), so a PR with more, or with
          # more changed files than were listed, could hide a kernel path behind filler; fail closed.
          if changed >= 3000 or changed > len(listed):
              sys.exit(f"the PR changes {changed} files and {len(listed)} were listed; too many to check, the check stays red")
          names = [name for pair in listed for name in pair if name]
          touched = sorted({f for f in names if control(f)})
          if touched:
              sys.exit("kernel paths changed (the operator merges these with a bypass, never this check): " + ", ".join(touched))
          print("no kernel path touched")
          PY
