name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: corepack enable
      - run: make setup
      - run: make check-repo gates-selftest conductor-test
  ts:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: corepack enable
      - run: make setup
      - run: make lint-ts typecheck test
  e2e:
    runs-on: ${{ fromJSON(vars.RUNNER_LARGE || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: corepack enable
      - run: make setup
      - name: Install the browser only when e2e tests exist
        run: |
          if [ -d packages/web/e2e ]; then pnpm exec playwright install --with-deps chromium; else echo "no packages/web/e2e yet"; fi
      - run: make test-e2e
  gate:
    if: always()
    needs: [gates, ts, e2e]
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Every job above succeeded (the one required check of the ruleset)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all gate jobs green"
