name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. JSON-Manifeste muessen valide sein
  manifest-validation:
    name: Manifest-Validierung (JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: jq empty auf allen Manifesten
        run: |
          set -euo pipefail
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty .mcp.json
          jq empty hooks/hooks.json
          echo "Alle Manifeste sind valides JSON."

  # 2. Hook-Quelldateien muessen syntaktisch valide sein
  hook-syntax:
    name: Hook-Syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Node 22 statt 20 (#600): node:sqlite ist ab 22.13.0 ohne
      # --experimental-sqlite-Flag nutzbar; "22" holt die jeweils aktuelle
      # 22.x-LTS-Version, die diese Schwelle erfuellt.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Rekursiv ueber alle getrackten *.mjs (#542): der frueher hier inline
      # stehende Glob `hooks/*.mjs` rekursierte nicht und verlor jede Datei,
      # die nach hooks/lib/ wanderte.
      - name: node --check fuer alle .mjs-Dateien
        run: bash scripts/dev/check-mjs-syntax.sh

  # 3. Jede Command/Agent-Datei braucht Frontmatter mit nicht-leerer description
  frontmatter-coverage:
    name: Frontmatter-Coverage (commands + agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Frontmatter + description pruefen
        run: |
          python3 - <<'PY'
          import sys, glob, pathlib, re
          bad = []
          files = sorted(
              glob.glob("commands/**/*.md", recursive=True)
              + glob.glob("agents/**/*.md", recursive=True)
          )
          for f in files:
              lines = pathlib.Path(f).read_text(encoding="utf-8").splitlines()
              if not lines or lines[0].strip() != "---":
                  bad.append((f, "kein Frontmatter (--- am Dateianfang fehlt)")); continue
              end = next((i for i in range(1, len(lines)) if lines[i].strip() == "---"), None)
              if end is None:
                  bad.append((f, "kein schliessendes ---")); continue
              fm = lines[1:end]
              di = next((i for i, l in enumerate(fm) if re.match(r"^description\s*:", l)), None)
              if di is None:
                  bad.append((f, "kein description-Feld")); continue
              val = re.match(r"^description\s*:\s*(.*)$", fm[di]).group(1).strip()
              if val in (">", "|", ">-", "|-", ">+", "|+", ""):
                  block = [fm[j].strip() for j in range(di + 1, len(fm)) if fm[j].strip()]
                  if not block:
                      bad.append((f, "description-Block leer"))
          print(f"geprueft: {len(files)} Dateien (commands + agents)")
          if bad:
              print("PROBLEME:")
              for f, why in bad:
                  print(f"  {f}: {why}")
              sys.exit(1)
          print("ALLE OK — Frontmatter + nicht-leere description vorhanden")
          PY

  # 4. Schnelle Skill-Manifest- und Naming-Checks
  skill-tests:
    name: Skill-Manifest- & Naming-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
      - name: pytest (Skills)
        run: uv run pytest tests/test_skills_manifest.py tests/test_skill_naming.py -v

  # 4b. Lint + Typpruefung (ruff + mypy) — Konfig in pyproject.toml (#202, vgl. #184)
  lint-types:
    name: Lint + Typen (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Versionen gepinnt (flowkit Stufe 0): ruff format --check ist blockierend —
      # ungepinnte Tool-Releases wuerden das Gate sonst ohne Code-Aenderung brechen.
      # Pins liegen seit #344 in pyproject.toml [project.optional-dependencies].dev
      # + uv.lock. Beim Bump: lokal mit derselben Version nachformatieren.
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
      - name: ruff check
        # Blockierend seit #340: 0 Findings lokal verifiziert.
        run: uv run ruff check .
      - name: ruff format --check
        # Blockierend seit Stufe-0-Hygiene (flowkit): Format-Stand ist sauber.
        run: uv run ruff format --check .
      - name: mypy
        # Blockierend seit #341: 0 Fehler lokal verifiziert.
        run: uv run mypy

  # 4c. flowkit-Hook-Harness: testet die DEPLOYTE Blocker-Datei, nicht das Template (#343)
  flowkit-hook-harness:
    name: flowkit-Hook-Harness (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: PreToolUse-Blocker Regression-Harness
        run: bash scripts/dev/test-pretooluse-blocker.sh
      # NLI-Zitatscan-Hook (#717): faehrt hooks/nli-quote-scan.mjs als echten
      # Prozess mit Stub-Interpreter — kein Modell, kein Netz, kein Python-Paket.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: NLI-Zitatscan-Hook Regression-Harness
        run: bash scripts/dev/test-nli-quote-scan-hook.sh

  # 4d. Shell-Syntax-Gate: bash -n ueber alle *.sh-Skripte im Repo (#469 AC3)
  shell-syntax:
    name: Shell-Syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Regression-Harness (beweist Fehlererkennung an kaputter Fixture)
        run: bash scripts/dev/test-check-shell-syntax.sh
      - name: bash -n ueber alle *.sh-Dateien
        run: bash scripts/dev/check-shell-syntax.sh

  # 5. Vollstaendige Test-Suite auf Ubuntu, Python-Matrix 3.11/3.12/3.13.
  #    Mindestversion 3.11 ist konsistent mit README.md und pyproject.toml (#201).
  #    3.14 folgt, sobald actions/setup-python es als stable fuehrt.
  #    macOS bewusst nicht mehr in der PR-Matrix (vormals 6 statt 3 Jobs):
  #    macOS-Runner kosten in GitHub Actions ~10x das Linux-Minutenkontingent,
  #    und eine Durchsicht des Codes fand keinen einzigen sys.platform/darwin-
  #    Branch in scripts/, academic_vault/ oder hooks/ sowie keine BSD/GNU-
  #    Coreutils-Fallen (sed -i, date -d etc.) in den Shell-/mjs-Skripten. Der
  #    einzige real aufgetretene macOS-Sonderfall (sqlite-vec/enable_load_extension
  #    auf manchem System-Python, #371) ist testseitig bereits per Skip-Guard
  #    abgefangen, nicht hart geprueft -- ein macOS-Job haette eine Regression
  #    dort ohnehin uebersprungen statt sie zu fangen. Operator-Entscheidung.
  python-tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
      # Hook-Tests starten .mjs-Hooks per `node` — daher zwingend noetig
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Smoke-Test der Kern-Importe
        run: uv run python -c "import requests, httpx, yaml, barcode, lxml, pdfplumber"
      # tests/test_smoke_e2e.py braucht ein eigenstaendiges venv unter
      # ~/.academic-research/venv mit installiertem mcp-SDK (harte Voraussetzung,
      # siehe tests/helpers/smoke_core.py:VENV_PYTHON). Ohne diesen Step skippt
      # die Suite modulweit statt zu laufen (#385). Bewusst NICHT das volle
      # scripts/setup.sh (Netzwerk-Installs, Permissions-Config) — nur die
      # harte Laufzeit-Abhaengigkeit des MCP-Server-Prozesses.
      # Version an uv.lock gekoppelt (nicht "mcp>=1.0"): dieser Schritt installiert
      # ohne Lockfile-Bezug, mcp 2.0.0 (PyPI) hat mcp.server.fastmcp entfernt und
      # bricht academic_vault/server.py::_build_mcp_server() (faengt ImportError,
      # Server startet als "mcp SDK nicht installiert"). uv.lock pinnt 1.28.1 —
      # beim naechsten `uv lock --upgrade` hier synchron mitziehen.
      - name: E2E-Smoke-Voraussetzung — venv mit mcp-SDK anlegen
        run: |
          set -euo pipefail
          uv venv "$HOME/.academic-research/venv"
          uv pip install --python "$HOME/.academic-research/venv/bin/python" "mcp==1.28.1"
          "$HOME/.academic-research/venv/bin/python" -c "from mcp.server.fastmcp import FastMCP; import mcp.client.stdio"
      - name: pytest mit Coverage
        # --cov-Ziele erweitert (#469 AC4): .github/scripts/flowkit_review (bislang
        # komplett unerfasst, siehe die neuen Tests in
        # tests/test_issue_469_flowkit_review_pipeline.py) und skills/ (hat bereits
        # laufende Tests, z.B. test_cluster_visualizer.py, test_prisma_flow.py,
        # test_zotero_import.py, die vorher unsichtbar blieben). Der ausgewiesene
        # Gesamt-Coverage-Wert sinkt dadurch sichtbar -- gewollt (Ehrlichkeit der
        # Zahl), keine Regression: bislang unsichtbare 0%-Dateien (u.a. merge.py,
        # apply_verdicts.py, render.py in flowkit_review) fliessen jetzt erstmals ein.
        run: |
          uv run pytest tests/ -p no:cacheprovider \
            --cov=scripts --cov=academic_vault \
            --cov=.github/scripts/flowkit_review --cov=skills \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Coverage-Report zu Codecov hochladen
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
