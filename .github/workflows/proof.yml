name: proof
on:
  workflow_dispatch:
    inputs:
      stage:
        description: stage to prove (1-5)
        required: true
permissions:
  contents: read
jobs:
  proof:
    runs-on: ${{ fromJSON(vars.RUNNER_LARGE || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: corepack enable
      - run: make setup
      - run: make check gates-selftest
      - name: Prove the stage on real infrastructure (the stage's tracking issue defines the script)
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          case "$STAGE" in [1-5]) ;; *) echo "stage must be 1-5" >&2; exit 1;; esac
          script="scripts/proof-stage-$STAGE.sh"
          test -x "$script" || { echo "stage $STAGE: no proof defined yet ($script)" >&2; exit 1; }
          "$script"
