name: proof
on:
  workflow_dispatch:
    inputs:
      stage:
        description: stage to prove (1, 2a, 2b, 3, 4 or 5)
        required: true
        type: choice
        options: ['1', '2a', '2b', '3', '4', '5']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ${{ fromJSON(vars.RUNNER_LARGE || '"ubuntu-latest"') }}
    timeout-minutes: 60
    env:
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: corepack enable
      - run: make setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: make check gates-selftest
      - name: Prove the stage against its contract
        run: |
          case "$STAGE" in 1|2a|2b|3|4|5) ;; *) echo "stage must be 1, 2a, 2b, 3, 4 or 5" >&2; exit 1;; esac
          make proof STAGE="$STAGE"
          python3 -I gates/gate.py proof-verify --stage "$STAGE"
