line-length = 110
extend-exclude = ["gates", "decisions", ".claude"]
target-version = "py314"

[lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RET", "FURB", "PERF", "C4", "PLR", "PLW", "ANN", "D", "ERA",
    "N", "RUF", "S", "PGH", "ASYNC", "TRY", "LOG", "G", "PTH", "DTZ", "ARG", "C90", "PT", "SLF",
]
ignore = ["D100", "D101", "D104", "D105", "D107", "D203", "D212", "PLR2004", "TRY003"]

[lint.pylint]
max-args = 6
max-branches = 8
max-statements = 25

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 8

[lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "PT018"]

[format]
docstring-code-format = true
