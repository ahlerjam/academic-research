name: protect-operator-files
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  protect:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Kernel paths are frozen for every author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CONTROL_GLOBS: '__CONTROL_GLOBS__'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          def api(path, jq):
              out = subprocess.run(["gh", "api", "--paginate", path, "--jq", jq], capture_output=True, text=True, check=True)
              return [line for line in out.stdout.splitlines() if line]
          def rx(glob):
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i): out, i = out + "(?:.*/)?", i + 3
                  elif glob.startswith("**", i): out, i = out + ".*", i + 2
                  elif glob[i] == "*": out, i = out + "[^/]*", i + 1
                  else: out, i = out + re.escape(glob[i]), i + 1
              return re.compile(out + "$")
          globs = [rx(g) for g in json.loads(os.environ["CONTROL_GLOBS"])]
          if not globs:
              sys.exit("no kernel globs embedded; the check stays red")
          control = lambda f: any(g.match(f) for g in globs)
          repo, pr = os.environ["REPO"], os.environ["PR"]
          names = api(f"repos/{repo}/pulls/{pr}/files", ".[] | .filename, (.previous_filename // empty)")
          touched = sorted({f for f in names if control(f)})
          if touched:
              sys.exit("kernel paths changed (the operator merges these with a bypass, never this check): " + ", ".join(touched))
          print("no kernel path touched")
          PY
