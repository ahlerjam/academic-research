# pyproject.toml — Tooling-Konfiguration fuer academic-research (Issue #202)
#
# Dieses Plugin ist primaer ein Claude-Code-Plugin mit lose gekoppelten Skripten
# unter scripts/ und academic_vault/. pyproject.toml dient hier vor allem als
# zentrale Tool-Konfiguration (pytest, ruff, mypy). Das build-system ist mit
# setuptools deklariert, damit Standard-Tooling die Metadaten lesen kann.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-research"
version = "6.5.1"
description = "Claude-Code-Plugin fuer wissenschaftliche Recherche, Vault-MCP-Server und Fetch-Pipelines."
readme = "README.md"
# Mindestversion: 3.11 (entwickelt + getestet mit 3.14, CI-Matrix 3.11/3.12/3.13).
# Konsistent mit README.md und .github/workflows/ci.yml (vgl. #201).
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jonas Ahler", email = "jam@ahler.org" }]
# Runtime-Deps: Single Source fuer Dev/CI (uv). Der Endnutzer-Installationsweg
# (scripts/setup.sh -> scripts/requirements.txt) bleibt bewusst pip-basiert (#344);
# beim Aendern von Runtime-Deps BEIDE Stellen pflegen.
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.28.1",
    "pypdf>=4.0.0",
    "pyyaml>=6.0.3",
    # Pflicht-Dependency des Excel-Backends document-skills:xlsx, das /excel und
    # /pickup aufrufen — Issue #367, Backend extern seit #445.
    "openpyxl>=3.1.5",
    # Renderer von word-export/slide-export (#446): skills/word-export/scripts/
    # render_docx.py und skills/slide-export/scripts/render_pptx.py erzeugen
    # .docx/.pptx deterministisch im Repo-Code -- dieselbe Rolle wie
    # render_tex.py im LaTeX-Pfad. Harte Runtime-Dependency (nicht dev): ohne
    # sie enden /academic-research:word und :slides in jeder realen Installation
    # ohne Zieldatei. Zweitstelle beim Aendern: scripts/requirements.txt.
    "python-docx>=1.1",
    "python-pptx>=1.0",
    # requests>=2.32.4: CVE-2024-35195 (cert verification bypass), CVE-2024-47081 (.netrc credential leak)
    "requests>=2.32.4",
    # lxml>=5.2.0: CVE-2022-2309 (NULL pointer deref)
    "lxml>=5.2.0",
    "python-barcode[images]>=0.16.1",
    # <2: mcp 2.0.0 (PyPI) entfernt mcp.server.fastmcp, das academic_vault/server.py
    # importiert — der MCP-Server startet sonst nur noch mit "mcp SDK nicht
    # installiert" (RuntimeError, server.py:1378). Siehe .github/workflows/ci.yml
    # E2E-Smoke-Voraussetzung-Step fuer die identische Begruendung.
    "mcp>=1.0,<2",
    "sqlite-vec==0.1.10a4",
    "jsonschema>=4.0",
    "pyzotero>=1.5",
    # Lokale Embedding-Pipeline der Vektor-Suche (#372): laedt
    # intfloat/multilingual-e5-small (MIT, 384d). Harte Dependency, weil
    # chunk_embeddings sonst in jeder realen Installation leer bliebe und
    # vault.search(rerank=True) auf reine FTS5-Umsortierung zurueckfaellt.
    "sentence-transformers>=3.0",
    # torch ist funktional eine transitive Dependency von sentence-transformers.
    # Es steht hier NUR, damit [tool.uv.sources] greifen kann: uv wendet Sources
    # ausschliesslich auf direkte Dependencies an. Ohne diesen Eintrag loest uv
    # torch von PyPI auf und zieht auf Linux den kompletten CUDA-Stack
    # (cuda-toolkit + nvidia-* + triton, mehrere GB) in uv.lock und in jeden
    # CI-Job. Mit dem Eintrag kommt das CPU-Wheel.
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # CI-Pins (blockierendes Format-Gate): Bump nur mit Nachformatierung, vgl. ci.yml
    "ruff==0.16.0",
    "mypy==2.3.0",
]
# Cloud-Reranker-SDKs (#376): optionale Extras, KEINE Hard-Dependency. Ohne
# gesetzten API-Key UND ohne installiertes FlagEmbedding (siehe Kommentar
# unten) faellt academic_vault.retrieval auf die unveraenderte RRF-Reihenfolge
# zurueck.
rerank-cloud = [
    "voyageai>=0.5,<1.0",
    "cohere>=5.0,<8.0",
]

# Lokaler Reranker-Fallback (BAAI/bge-reranker-v2-m3, #376): FlagEmbedding ist
# ABSICHTLICH KEIN uv-verwaltetes Extra (P1-Fix, Fixrunde PR #422) -- kein
# `rerank-local`-Eintrag hier, kein Eintrag in uv.lock. Grund: uv loest
# [project.dependencies], optional-dependencies und dev-Gruppen ohne
# `tool.uv.conflicts` GEMEINSAM zu EINER universellen Version je Paket auf.
# FlagEmbedding 1.4.0 braucht `transformers<5.0` (ruft intern
# Tokenizer.prepare_for_model() auf, das in transformers>=5.x entfernt wurde --
# verifiziert per Live-Download, AttributeError). Eine solche Ceiling in
# EINEM Extra deklariert haette trotzdem JEDE Installation erzwungen, auch
# `uv sync --extra dev` ohne diesen Extra (real beobachtet: transformers
# 5.14.1->4.57.6, huggingface-hub 1.24.0->0.36.2 im Default-Lock). Der
# naheliegende Ausweg -- `tool.uv.conflicts` zwischen `dev` und einem
# `rerank-local`-Extra -- verbietet aber die GLEICHZEITIGE Installation beider
# (uv-Doku: konfliktaer markierte Extras "cannot be installed into the same
# environment simultaneously"), genau das braucht jedoch der AC2-Live-Test
# (pytest kommt aus `dev`). Deshalb bewusst außerhalb der uv-Resolution:
# Opt-in nur manuell, NACH `uv sync --extra dev`, per
#   uv pip install 'FlagEmbedding>=1.3,<2.0' 'transformers<5.0'
#   uv run --no-sync pytest ...   # --no-sync, sonst syncet uv den Downgrade weg
# Siehe tests/test_issue_376_reranker_extras.py fuer die Regressionstests
# (FlagEmbedding darf hier NIE wieder auftauchen, transformers NIE wieder eine
# Ceiling in [project.dependencies] tragen).

# uv: Repo ist kein installierbares Package (lose gekoppelte Skripte) —
# uv sync installiert nur die Dependencies, baut das Projekt nicht.
[tool.uv]
package = false

# torch aus dem CPU-Index von PyTorch beziehen. Die Default-Wheels auf PyPI
# buendeln auf Linux den CUDA-Stack; der Vault rechnet e5-small auf der CPU,
# GPU-Wheels waeren reiner Ballast (Download, Cache, Runner-Disk).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# explicit = true: dieser Index wird NUR fuer Pakete benutzt, die ihn oben
# ausdruecklich referenzieren — alle uebrigen Dependencies kommen unveraendert
# von PyPI (kein Dependency-Confusion-Risiko durch einen breiten Extra-Index).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
# WICHTIG (Issue #202): Diese Sektion darf die bestehende Test-Discovery NICHT
# brechen. rootdir bleibt das Repo-Root (Verzeichnis dieser Datei), testpaths
# zeigt auf tests/ — exakt das Verhalten von `pytest tests/`.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Bewusst KEINE erzwungenen addopts (z.B. --cov / -x): die CI setzt Coverage
# und sonstige Flags weiterhin via CLI. So bleibt die Suite identisch gruen.
filterwarnings = [
    "ignore::DeprecationWarning:PyPDF2",
]

# ---------------------------------------------------------------------------
# coverage.py (Issue #469 AC4)
# ---------------------------------------------------------------------------
# --cov-Ziele werden per CLI in .github/workflows/ci.yml gesetzt (scripts,
# academic_vault, .github/scripts/flowkit_review, skills). Kein omit mehr
# fuer den ehemals vendorierten xlsx-Excel-Skillpfad unter skills/ — der
# wurde in #445 entvendoriert und existiert in diesem Branch nicht mehr.

# ---------------------------------------------------------------------------
# ruff — Linter + Formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts", "academic_vault", "tests"]
extend-exclude = [
    "skills/humanizer-de",  # vendored
    "evals",
]

[tool.ruff.lint]
# Konservatives Default-Set, damit bestehender Code nicht massenhaft bricht:
# E/F = pycodestyle-Errors + pyflakes, I = Import-Sortierung, UP = pyupgrade.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # Zeilenlaenge — wird vom Formatter gehandhabt
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — statische Typpruefung
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["scripts", "academic_vault"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# Schrittweise Einfuehrung — vorerst nicht-strikt, damit CI nicht sofort rot ist.
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*"]
ignore_errors = true

# Der ML-Stack (seit #372 im Environment) liefert eigene Stubs, die PEP-695-
# `type`-Statements nutzen. Unter python_version = "3.11" kann mypy sie nicht
# parsen und bricht mit einem Syntaxfehler ab, BEVOR es unseren Code sieht
# ("errors prevented further checking"). Diese Pakete pruefen wir ohnehin nicht
# — also ihren Importen gar nicht erst folgen.
[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "sentence_transformers",
    "sentence_transformers.*",
    # Lokaler Reranker-Fallback (#376) -- kein uv-Extra mehr (siehe
    # [project.optional-dependencies]-Kommentar), aber falls manuell per
    # `uv pip install FlagEmbedding` in ein Dev-Venv installiert: gleicher
    # Grund wie sentence_transformers oben.
    "FlagEmbedding",
    "FlagEmbedding.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
